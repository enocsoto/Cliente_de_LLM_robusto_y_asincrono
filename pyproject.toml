[project]
name = "cliente-llm-robusto-asincrono"
version = "0.1.0"
description = "Cliente de LLM robusto y asíncrono."
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "openai",
    "anthropic",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["async_llm_manager", "schemas", "clients"]
